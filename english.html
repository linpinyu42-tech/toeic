<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEIC 記憶曲線單字庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- 頁首與統計 -->
    <header class="text-center">
      <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">TOEIC 記憶曲線單字卡</h1>
      <div class="flex justify-center gap-4 text-xs font-semibold text-slate-500 mt-2">
        <span id="stat-due" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">今日待複習: 0</span>
        <span id="stat-total" class="bg-slate-200 text-slate-700 px-3 py-1 rounded-full">總單字庫: 0</span>
      </div>
    </header>

    <!-- 分頁導覽列 -->
    <nav class="flex bg-slate-200 p-1 rounded-xl gap-1 text-sm font-semibold">
      <button id="tab-btn-review" onclick="switchTab('review')" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-indigo-600 transition">
        🎯 開始複習
      </button>
      <button id="tab-btn-list" onclick="switchTab('list')" class="flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">
        📚 總單字庫 (<span id="tab-total-count">0</span>)
      </button>
      <button id="tab-btn-add" onclick="switchTab('add')" class="flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">
        ➕ 新增單字
      </button>
    </nav>

    <!-- 1. 複習分頁 -->
    <section id="tab-review" class="space-y-4">
      <main id="card-container" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 min-h-[320px] flex flex-col justify-between transition-all">
        <!-- 內容由 JS 動態渲染 -->
      </main>
    </section>

    <!-- 2. 總單字庫清單分頁 -->
    <section id="tab-list" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4 hidden">
      <div class="flex flex-col sm:flex-row gap-3 justify-between items-start sm:items-center">
        <h2 class="text-base font-bold text-slate-900">單字庫管理</h2>
        <input 
          id="search-input" 
          type="text" 
          placeholder="搜尋單字或釋義..." 
          oninput="renderWordList()"
          class="w-full sm:w-64 px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- 單字列表容器 -->
      <div id="word-list-container" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
        <!-- 由 JS 動態渲染 -->
      </div>
    </section>

    <!-- 3. 新增單字分頁 -->
    <section id="tab-add" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 hidden">
      <h2 class="text-base font-bold text-slate-900 mb-4">新增多益單字</h2>
      <form id="add-form" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">英文單字 *</label>
          <input id="input-word" type="text" required placeholder="例如: implement, negotiate"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">中文解釋與詞性 *</label>
          <input id="input-def" type="text" required placeholder="例如: v. 實施、執行"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">商務例句 (選填)</label>
          <textarea id="input-example" rows="2" placeholder="例如: We plan to implement the strategy next quarter."
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm transition">
          加入單字庫
        </button>
      </form>
    </section>

  </div>

  <!-- 4. 編輯單字彈窗 (Modal) -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="text-lg font-bold text-slate-900">✏️ 修改單字內容</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
      </div>

      <form id="edit-form" class="space-y-3">
        <input type="hidden" id="edit-id" />
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">英文單字 *</label>
          <input id="edit-word" type="text" required
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">中文解釋與詞性 *</label>
          <input id="edit-def" type="text" required
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">商務例句 (選填)</label>
          <textarea id="edit-example" rows="2"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeEditModal()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg text-sm transition">
            取消
          </button>
          <button type="submit" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition">
            儲存修改
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 預設單字資料
    const DEFAULT_WORDS = [
      {
        id: "1",
        word: "implement",
        definition: "v. 實施、執行",
        example: "The board decided to implement the new policy next month.",
        repetition: 0,
        interval: 0,
        easeFactor: 2.5,
        nextReviewDate: new Date().toISOString().split('T')[0]
      },
      {
        id: "2",
        word: "negotiate",
        definition: "v. 談判、協商",
        example: "They are trying to negotiate a better deal with the supplier.",
        repetition: 0,
        interval: 0,
        easeFactor: 2.5,
        nextReviewDate: new Date().toISOString().split('T')[0]
      },
      {
        id: "3",
        word: "feasible",
        definition: "adj. 可行的、行得通的",
        example: "It is not financially feasible to expand the market this year.",
        repetition: 1,
        interval: 3,
        easeFactor: 2.5,
        nextReviewDate: new Date(Date.now() + 86400000 * 2).toISOString().split('T')[0]
      }
    ];

    let words = JSON.parse(localStorage.getItem('toeic_words')) || DEFAULT_WORDS;
    let isFlipped = false;
    let currentTab = 'review';

    function saveWords() {
      localStorage.setItem('toeic_words', JSON.stringify(words));
      updateStats();
    }

    function getTodayStr() {
      return new Date().toISOString().split('T')[0];
    }

    function getDueWords() {
      const today = getTodayStr();
      return words.filter(w => w.nextReviewDate <= today);
    }

    function updateStats() {
      const due = getDueWords().length;
      document.getElementById('stat-due').textContent = `今日待複習: ${due}`;
      document.getElementById('stat-total').textContent = `總單字庫: ${words.length}`;
      document.getElementById('tab-total-count').textContent = words.length;
    }

    // 發音功能 (Web Speech API)
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 分頁切換
    function switchTab(tab) {
      currentTab = tab;
      const tabs = ['review', 'list', 'add'];
      tabs.forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tab) {
          el.classList.remove('hidden');
          btn.className = "flex-1 py-2 rounded-lg bg-white shadow-sm text-indigo-600 transition";
        } else {
          el.classList.add('hidden');
          btn.className = "flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition";
        }
      });

      if (tab === 'review') renderCard();
      if (tab === 'list') renderWordList();
    }

    // SM-2 排程核心計算
    function calculateNextReview(word, rating) {
      let { repetition, interval, easeFactor } = word;

      if (rating === 0) {
        repetition = 0;
        interval = 1;
      } else {
        if (repetition === 0) interval = 1;
        else if (repetition === 1) interval = 3;
        else interval = Math.round(interval * easeFactor);
        repetition += 1;
      }

      easeFactor = easeFactor + (0.1 - (3 - rating) * (0.08 + (3 - rating) * 0.02));
      if (easeFactor < 1.3) easeFactor = 1.3;

      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + interval);

      return {
        ...word,
        repetition,
        interval,
        easeFactor: parseFloat(easeFactor.toFixed(2)),
        nextReviewDate: nextDate.toISOString().split('T')[0]
      };
    }

    // 渲染複習卡片
    function renderCard() {
      const dueWords = getDueWords();
      const container = document.getElementById('card-container');

      if (dueWords.length === 0) {
        container.innerHTML = `
          <div class="my-auto text-center py-10">
            <div class="text-4xl mb-3">🎉</div>
            <h3 class="text-lg font-bold text-slate-800">今日複習已全部完成！</h3>
            <p class="text-xs text-slate-500 mt-1">單字已按照記憶曲線排程，你也可以到「總單字庫」檢視所有單字。</p>
          </div>
        `;
        return;
      }

      const current = dueWords[0];

      if (!isFlipped) {
        container.innerHTML = `
          <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
            <span>記憶等級: Lv.${current.repetition}</span>
            <span>下次間隔: ${current.interval} 天</span>
          </div>

          <div class="my-auto text-center py-6">
            <div class="flex items-center justify-center gap-2">
              <h2 class="text-3xl md:text-4xl font-black text-slate-900 tracking-wide">${current.word}</h2>
              <button onclick="speak('${current.word}')" class="p-1.5 text-slate-400 hover:text-indigo-600 transition" title="朗讀發音">🔊</button>
            </div>
            <p class="text-xs text-slate-400 mt-2">點擊下方按鈕查看釋義</p>
          </div>

          <button onclick="flipCard()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition">
            查看釋義與例句
          </button>
        `;
      } else {
        container.innerHTML = `
          <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
            <span>記憶等級: Lv.${current.repetition}</span>
            <span>Ease Factor: ${current.easeFactor}</span>
          </div>

          <div class="my-auto text-center py-4 space-y-3">
            <div class="flex items-center justify-center gap-2">
              <h2 class="text-2xl font-black text-slate-900">${current.word}</h2>
              <button onclick="speak('${current.word}')" class="p-1 text-slate-400 hover:text-indigo-600 transition">🔊</button>
            </div>
            <p class="text-lg font-bold text-indigo-600">${current.definition}</p>
            ${current.example ? `
              <div class="text-left bg-slate-50 p-3 rounded-lg border border-slate-100 mt-2">
                <p class="text-xs font-semibold text-slate-400 mb-0.5">商務例句：</p>
                <p class="text-xs text-slate-600 italic">"${current.example}"</p>
              </div>
            ` : ''}
          </div>

          <div class="grid grid-cols-4 gap-2 pt-3 border-t border-slate-100">
            <button onclick="handleRate(0)" class="py-2 bg-red-50 text-red-600 hover:bg-red-100 font-bold rounded-lg text-xs transition">忘記<br><span class="font-normal text-[10px]">1天後</span></button>
            <button onclick="handleRate(1)" class="py-2 bg-amber-50 text-amber-600 hover:bg-amber-100 font-bold rounded-lg text-xs transition">困難<br><span class="font-normal text-[10px]">縮短</span></button>
            <button onclick="handleRate(2)" class="py-2 bg-blue-50 text-blue-600 hover:bg-blue-100 font-bold rounded-lg text-xs transition">良好<br><span class="font-normal text-[10px]">標準</span></button>
            <button onclick="handleRate(3)" class="py-2 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-bold rounded-lg text-xs transition">簡單<br><span class="font-normal text-[10px]">延長</span></button>
          </div>
        `;
      }
    }

    function flipCard() {
      isFlipped = true;
      renderCard();
    }

    function handleRate(rating) {
      const dueWords = getDueWords();
      if (dueWords.length === 0) return;

      const current = dueWords[0];
      const updated = calculateNextReview(current, rating);

      words = words.map(w => w.id === current.id ? updated : w);
      saveWords();
      isFlipped = false;
      renderCard();
    }

    // 渲染總單字庫清單
    function renderWordList() {
      const query = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
      const container = document.getElementById('word-list-container');
      const today = getTodayStr();

      const filtered = words.filter(w => 
        w.word.toLowerCase().includes(query) || 
        w.definition.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-400 text-center py-6">查無相關單字</p>`;
        return;
      }

      container.innerHTML = filtered.map(w => {
        const isDue = w.nextReviewDate <= today;
        return `
          <div class="p-3.5 border border-slate-200 rounded-xl bg-white hover:border-slate-300 transition flex flex-col gap-2">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-baseline gap-2">
                <span class="font-bold text-base text-slate-900">${w.word}</span>
                <span class="text-sm text-slate-600 font-medium">${w.definition}</span>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="speak('${w.word}')" class="p-1 text-slate-400 hover:text-indigo-600 transition" title="發音">🔊</button>
                <button onclick="openEditModal('${w.id}')" class="p-1 text-slate-400 hover:text-blue-600 transition text-xs" title="修改內容">✏️</button>
                <button onclick="resetWordProgress('${w.id}')" class="p-1 text-slate-400 hover:text-amber-600 transition text-xs" title="重置為今日複習">🔄</button>
                <button onclick="deleteWord('${w.id}')" class="p-1 text-slate-400 hover:text-red-600 transition text-xs" title="刪除單字">🗑️</button>
              </div>
            </div>
            
            ${w.example ? `<p class="text-xs text-slate-500 italic bg-slate-50 p-2 rounded">"${w.example}"</p>` : ''}

            <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1 border-t border-slate-100">
              <span>等級: Lv.${w.repetition} (間隔 ${w.interval} 天)</span>
              <span class="${isDue ? 'text-amber-600 font-semibold' : 'text-slate-400'}">
                ${isDue ? '⚡ 今日待複習' : `下次複習: ${w.nextReviewDate}`}
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    // 刪除單字
    function deleteWord(id) {
      if (!confirm('確定要刪除這個單字嗎？')) return;
      words = words.filter(w => w.id !== id);
      saveWords();
      renderWordList();
      renderCard();
    }

    // 重置單字排程至今日
    function resetWordProgress(id) {
      words = words.map(w => {
        if (w.id === id) {
          return { ...w, repetition: 0, interval: 0, nextReviewDate: getTodayStr() };
        }
        return w;
      });
      saveWords();
      renderWordList();
      renderCard();
    }

    // 開啟編輯 Modal
    function openEditModal(id) {
      const wordItem = words.find(w => w.id === id);
      if (!wordItem) return;

      document.getElementById('edit-id').value = wordItem.id;
      document.getElementById('edit-word').value = wordItem.word;
      document.getElementById('edit-def').value = wordItem.definition;
      document.getElementById('edit-example').value = wordItem.example || '';

      document.getElementById('edit-modal').classList.remove('hidden');
    }

    // 關閉編輯 Modal
    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    // 儲存修改表單
    document.getElementById('edit-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const wordVal = document.getElementById('edit-word').value.trim();
      const defVal = document.getElementById('edit-def').value.trim();
      const exampleVal = document.getElementById('edit-example').value.trim();

      words = words.map(w => {
        if (w.id === id) {
          return {
            ...w,
            word: wordVal,
            definition: defVal,
            example: exampleVal
          };
        }
        return w;
      });

      saveWords();
      closeEditModal();
      renderWordList();
      renderCard();
    });

    // ESC 快捷鍵關閉 Modal
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeEditModal();
    });

    // 新增單字表單
    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const wordInput = document.getElementById('input-word');
      const defInput = document.getElementById('input-def');
      const exampleInput = document.getElementById('input-example');

      const newWordItem = {
        id: Date.now().toString(),
        word: wordInput.value.trim(),
        definition: defInput.value.trim(),
        example: exampleInput.value.trim(),
        repetition: 0,
        interval: 0,
        easeFactor: 2.5,
        nextReviewDate: getTodayStr()
      };

      words.unshift(newWordItem);
      saveWords();

      wordInput.value = '';
      defInput.value = '';
      exampleInput.value = '';

      switchTab('list');
    });

    // 初始載入
    updateStats();
    renderCard();
  </script>
</body>
</html>
